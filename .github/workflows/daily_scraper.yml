name: Daily Supermarket Flyers Scraper

on:
  schedule:
    # Roda todos os dias às 10:00 UTC (07:00 Horário de Brasília)
    - cron: '0 10 * * *'
  workflow_dispatch:
    # Permite disparar manualmente pelo painel do GitHub Actions
    inputs:
      date_mode:
        description: 'Modo de data'
        required: true
        default: 'last_7_days'
        type: choice
        options:
          - 'last_7_days'
          - 'last_3_days'
          - 'yesterday_today'
          - 'today'
      limit:
        description: 'Limite de posts por perfil'
        required: true
        default: '5'

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pages: write

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Executar Raspagem, IA, Banco de Dados e Telegram
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ENABLED: "true"
          TELEGRAM_SEND_EXCEL: "true"
        run: |
          DATE_MODE="${{ github.event.inputs.date_mode || 'last_7_days' }}"
          LIMIT="${{ github.event.inputs.limit || '5' }}"
          python cron_job.py --date-mode "$DATE_MODE" --limit "$LIMIT"

      - name: 🌐 Atualizar Dados do GitHub Pages
        run: |
          mkdir -p docs/data
          if [ -f output/latest_results.json ]; then
            cp output/latest_results.json docs/data/latest_results.json
          fi
          if [ -f output/latest_results.xlsx ]; then
            cp output/latest_results.xlsx docs/data/latest_results.xlsx
          fi

      - name: 💾 Salvar Banco de Dados, Planilhas e Dashboard no Repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config advice.addIgnoredFile false || true
          git add -f data/offers.db docs/ output/ || git add -A -f
          if git diff --staged --quiet; then
            echo "Nenhuma alteração para commitar."
          else
            git commit -m "🤖 [Automated] Atualização diária do banco de dados, encartes e dashboard [skip ci]"
            git push
          fi

      - name: 📤 Fazer Upload dos Arquivos Gerados (Artefatos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-e-banco-dados
          path: |
            output/
            data/offers.db
            docs/data/
          retention-days: 30
